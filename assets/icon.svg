<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Core Orb Gradient -->
    <linearGradient id="agy-orb-gradient" x1="12" y1="11" x2="25" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="85%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>

    <!-- Front Orbit Ring Gradient (Glowing Vibrant Gradient) -->
    <linearGradient id="agy-ring-front" x1="6" y1="24" x2="31" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Back Orbit Ring Gradient (Subtle Occluded Depth) -->
    <linearGradient id="agy-ring-back" x1="7" y1="12" x2="29" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Specular Highlight Curve -->
    <linearGradient id="agy-highlight-grad" x1="14" y1="12" x2="19" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Back Segment of Orbit Ring (passes behind central sphere) -->
  <path d="M 6.8 14.2 C 8.2 9.6 17.8 7.2 26.2 10.8 C 28.0 11.6 29.3 12.6 30.2 13.8" 
        stroke="url(#agy-ring-back)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Central Antigravity Sphere -->
  <circle cx="18" cy="18" r="7.5" fill="url(#agy-orb-gradient)"/>

  <!-- Elegant Crescent Specular Highlight (adds glass/liquid depth) -->
  <path d="M 13.2 15.2 A 5.5 5.5 0 0 1 21.0 13.0 A 6.2 6.2 0 0 0 14.0 18.0 Z" 
        fill="url(#agy-highlight-grad)"/>

  <!-- Front Segment of Orbit Ring (sweeps in front with vibrant glow) -->
  <path d="M 30.2 13.8 C 31.4 18.2 21.8 26.2 12.8 24.2 C 9.4 23.4 7.4 21.8 6.6 19.6" 
        stroke="url(#agy-ring-front)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Left Satellite Node (DSH Cyan Anchor) -->
  <circle cx="8.2" cy="18.2" r="2.2" fill="#00D2FF"/>
  <circle cx="8.2" cy="18.2" r="1.0" fill="#FFFFFF"/>

  <!-- Right Satellite Node (Antigravity Magenta Particle) -->
  <circle cx="28.4" cy="20.4" r="1.8" fill="#F43F5E"/>
  <circle cx="28.4" cy="20.4" r="0.8" fill="#FFFFFF"/>
</svg>
